services:
  db:
    image: postgres:18.2-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  
  astro:
    build: ./client
    environment:
      DATABASE_URL: ${POSTGRES_DB_URL}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ASTRO_PORT}:4321"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4321/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./server
    environment:
      DATABASE_URL: ${POSTGRES_DB_URL}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT}:3333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
