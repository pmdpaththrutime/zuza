services:
  astro:
    build: ./client
    ports:
      - "${ASTRO_PORT}:4321"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4321/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./server
    volumes:
      - ./server/zuza.db:/app/zuza.db
    ports:
      - "${API_PORT}:3333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
